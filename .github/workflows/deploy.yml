name: Publish plasmoid

on:
  release:
    types: 
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || format('test-{0}', github.run_number) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install translation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends gettext

      - name: Create translation files
        run: ./create-translations.sh

      - name: Package plasmoid
        working-directory: package
        run: |
          zip -r "../kppleMenu-${RELEASE_TAG}.plasmoid" \
            metadata.json contents

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kppleMenu-${{ env.RELEASE_TAG }}
          path: kppleMenu-${{ env.RELEASE_TAG }}.plasmoid
          if-no-files-found: error

      - name: Attach plasmoid to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "kppleMenu-${RELEASE_TAG}.plasmoid" \
            --clobber
